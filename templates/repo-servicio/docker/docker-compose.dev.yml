name: udesa-x-servicio

services:
  servicio:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://servicio:servicio@postgres:5432/servicio
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: servicio
      POSTGRES_PASSWORD: servicio
      POSTGRES_DB: servicio
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servicio -d servicio"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      # PostgreSQL 18 stores data in a version-specific subdirectory, so the mount
      # goes on /var/lib/postgresql and not on /data as in earlier versions.
      - postgres-data:/var/lib/postgresql

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
