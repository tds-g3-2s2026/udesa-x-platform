# Shared ALB group, order and host set by the cátedra (class 6, Cloud Computing I,
# 2026-09-14). Group-scoped annotations (scheme, listen-ports, certificate-arn,
# subnets) belong to the shared group and are intentionally not declared here.
# Everything under /api goes to api-gateway, which fans out to users-api and
# posts-api by prefix (udesa-x-api-gateway, src/routing.ts). Adding a backend
# route is a change in that service, deployed by CI, and never a new revision
# of this file, which the docente applies by hand.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tds-group-3-ingress
  namespace: tds-group-3
  annotations:
    alb.ingress.kubernetes.io/group.name: tds-shared
    alb.ingress.kubernetes.io/group.order: "203"
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /healthcheck
spec:
  ingressClassName: alb
  rules:
    - host: tds-group-3.tds-linar.udesa.edu.ar
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 80
