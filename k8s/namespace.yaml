apiVersion: v1
kind: Namespace
metadata:
  name: tds-group-3
  labels:
    name: tds-group-3
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tds-group-3-quota
  namespace: tds-group-3
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    pods: "10"
    services: "6"
    configmaps: "5"
    secrets: "6"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: tds-group-3-limits
  namespace: tds-group-3
spec:
  limits:
    - type: Container
      min:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 512Mi
