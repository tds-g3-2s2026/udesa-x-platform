apiVersion: v1
kind: Namespace
metadata:
  name: tds-group-3
  labels:
    name: tds-group-3
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tds-group-3-quota
  namespace: tds-group-3
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "5"
    limits.memory: 5Gi
    pods: "11"
    services: "7"
    configmaps: "6"
    secrets: "7"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: tds-group-3-limits
  namespace: tds-group-3
spec:
  limits:
    - type: Container
      min:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 512Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tds-group-3-bedrock-sa
  namespace: tds-group-3
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::172786533418:role/tds-group-3-bedrock-role
