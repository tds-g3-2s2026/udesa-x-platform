# Quota and limit values set by the cátedra (class 6, Cloud Computing I, 2026-09-14),
# with pods, services, configmaps and secrets raised on request on 2026-10-26 for
# RabbitMQ and notifications-api (udesa-x-platform#111).
# Applied by the docente after PR approval; the team has read-only access.
apiVersion: v1
kind: Namespace
metadata:
  name: tds-group-3
  labels:
    name: tds-group-3
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tds-group-3-quota
  namespace: tds-group-3
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    # 6 running (api-gateway, users-api, posts-api, notifications-api, redis,
    # rabbitmq) plus, during a deploy of users-api and posts-api at once, one
    # maxSurge pod and one migration Job each.
    pods: "10"
    # api-gateway, users-api, posts-api, notifications-api, redis, rabbitmq.
    services: "6"
    # kube-root-ca.crt, which Kubernetes creates, plus one per service with code.
    configmaps: "5"
    # api-gateway, users-api, posts-api, notifications-api and rabbitmq, plus the
    # temporary one of crear-bases-postgres.yml while it runs.
    secrets: "6"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: tds-group-3-limits
  namespace: tds-group-3
spec:
  limits:
    - type: Container
      min:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 512Mi
