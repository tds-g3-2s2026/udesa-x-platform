# ServiceAccount that assistant-api runs as to assume tds-group-3-bedrock-role
# through IRSA: the role's trust policy only accepts this ServiceAccount
# (ADR-023). Applied by the docente, like namespace.yaml, because the pipeline
# role cannot create ServiceAccounts.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tds-group-3-bedrock-sa
  namespace: tds-group-3
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::172786533418:role/tds-group-3-bedrock-role
