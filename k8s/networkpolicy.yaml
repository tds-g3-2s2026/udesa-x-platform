# Only pods of this namespace reach each other; api-gateway opens itself to the ALB
# with its own policy. Applied by the docente, next to namespace.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tds-group-3-net-policy
  namespace: tds-group-3
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
