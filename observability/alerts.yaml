  "rules": [
    {
      "uid": "udesa-login-latency",
      "title": "login · Latencia p95",
      "ruleGroup": "UdeSA-X SLO",
      "folderUID": "${FOLDER_UID}",
      "condition": "B",
      "for": "5m",
      "noDataState": "OK",
      "execErrState": "Error",
      "isPaused": false,
      "labels": {
        "service": "api-gateway",
        "flow": "login",
        "severity": "warning"
      },
      "annotations": {
        "summary": "Latencia p95 fuera del objetivo de login",
        "description": "Ventana de cinco minutos e incumplimiento sostenido durante cinco minutos.",
        "__dashboardUid__": "udesa-x-observability",
        "__panelId__": "7"
      },
      "notification_settings": {
        "receiver": "${CONTACT_POINT}",
        "group_by": [
          "alertname",
          "flow"
        ],
        "group_wait": "30s",
        "group_interval": "5m",
        "repeat_interval": "96h"
      },
      "data": [
        {
          "refId": "A",
          "queryType": "",
          "relativeTimeRange": {
            "from": 300,
            "to": 0
          },
          "datasourceUid": "${METRICS_UID}",
          "model": {
            "expr": "histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{job=\"api-gateway\",udesa_http_flow=\"login\"}[5m])))",
            "refId": "A",
            "instant": true,
            "range": false,
            "intervalMs": 1000,
            "maxDataPoints": 43200
          }
        },
        {
          "refId": "B",
          "queryType": "",
          "relativeTimeRange": {
            "from": 0,
            "to": 0
          },
          "datasourceUid": "__expr__",
          "model": {
            "refId": "B",
            "type": "threshold",
            "expression": "A",
            "conditions": [
              {
                "type": "query",
                "query": {
                  "params": [
                    "B"
                  ]
                },
                "reducer": {
                  "type": "last",
                  "params": []
                },
                "operator": {
                  "type": "and"
                },
                "evaluator": {
                  "type": "gt",
                  "params": [
                    0.4
                  ]
                }
              }
            ]
          }
        }
      ]
    },
