name: Observabilidad

on:
  pull_request:
    paths:
      - "observability/**"
      - ".github/workflows/observability.yml"
  push:
    branches: [main]

jobs:
  configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s observability -v
