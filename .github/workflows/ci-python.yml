# CI for the Python services. Lives here once and is consumed with:
#
#   jobs:
#     ci:
#       uses: tds-g3-2s2026/udesa-x-platform/.github/workflows/ci-python.yml@main
#       secrets: inherit
#
# Tests run inside the image: the consumer needs a `test` stage in its Dockerfile.
#
# A service that publishes events sets `rabbitmq: true`: RabbitMQ starts next to
# the job, and the tests and the production image reach it through RABBITMQ_URL,
# the same way they reach PostgreSQL and Redis.

name: CI Python

on:
  workflow_call:
    inputs:
      version-python:
        description: "Version de Python. Fijada en ARQUITECTURA.md."
        type: string
        default: "3.13"
      cobertura-minima:
        description: "Porcentaje minimo de cobertura que exige la consigna."
        type: number
        default: 85
      bloquear-por-cobertura:
        description: >
          Si es true, el PR se bloquea cuando la cobertura queda por debajo del minimo.
          ARQUITECTURA.md activa el gate en S3 para backend y en S5 para los clientes;
          hasta entonces el porcentaje se reporta sin frenar a nadie.
        type: boolean
        default: false
      correr-integracion:
        description: "Correr tests/integration contra PostgreSQL y Redis."
        type: boolean
        default: true
      rabbitmq:
        description: >
          Levantar RabbitMQ al lado de los tests y de la imagen de produccion, con
          RABBITMQ_URL apuntando a el. Para los servicios que publican eventos.
        type: boolean
        default: false

jobs:
  calidad:
    name: Lint y formato
    runs-on: ubuntu-latest

    # On the runner: lint reads the source, not the runtime environment.
    steps:
      - uses: actions/checkout@v5

      - name: Instalar uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ inputs.version-python }}
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --locked

      - name: Ruff, reglas de lint
        run: uv run ruff check --output-format=github .

      - name: Ruff, formato
        run: uv run ruff format --check .

  contratos:
    name: Contratos de eventos al dia
    runs-on: ubuntu-latest

    # Against platform's main and not a pinned copy: a contract that changed
    # there and was not synced here has to turn this repo red. A repo that uses
    # no events passes as long as it has no contracts/events/.
    steps:
      - uses: actions/checkout@v5

      - name: Traer udesa-x-platform
        uses: actions/checkout@v5
        with:
          repository: tds-g3-2s2026/udesa-x-platform
          ref: main
          path: .udesa-x-platform

      - name: Comparar contracts/events con docs/eventos
        env:
          REPO: ${{ github.event.repository.name }}
        run: ./.udesa-x-platform/scripts/verificar-contratos.sh "${REPO#udesa-x-}" .

  tests:
    name: Tests y cobertura
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: users
          POSTGRES_PASSWORD: users
          POSTGRES_DB: users
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U users -d users"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      rabbitmq:
        # An empty image skips the service, so a repo that does not ask for it
        # starts nothing.
        image: ${{ inputs.rabbitmq && 'rabbitmq:4-alpine' || '' }}
        # Not guest: RabbitMQ only lets guest in over loopback, and through the
        # published port the broker sees the Docker bridge address instead.
        env:
          RABBITMQ_DEFAULT_USER: users
          RABBITMQ_DEFAULT_PASS: users
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # They live on the runner's localhost, which is why the steps use --network host.
      DATABASE_URL: postgresql+asyncpg://users:users@localhost:5432/users
      REDIS_URL: redis://localhost:6379/0
      # ADR-014: posts-api reads the revocation marks that users-api writes. In
      # production that is /0; here it is a database of its own, so a flush of
      # REDIS_URL by the tests does not wipe the marks a test just wrote.
      # Services that do not read it ignore it.
      AUTH_REDIS_URL: redis://localhost:6379/2
      # Throwaway Ed25519 public key. A service that verifies tokens refuses to
      # start without one, and the CI never checks a real signature: the tests
      # mint their own pair. Services that do not read it ignore it.
      JWT_PUBLIC_KEY: |
        -----BEGIN PUBLIC KEY-----
        MCowBQYDK2VwAyEAqImbSOwLY35gB4XytjbBlXzbZnrfT3XBY5ewbejR5nk=
        -----END PUBLIC KEY-----
      # Throwaway too. ADR-011: posts-api and users-api refuse to start without
      # the secret of their internal routes. Services that do not read it ignore it.
      INTERNAL_API_TOKEN: ci-internal-token
      # Points at the rabbitmq service above, which only runs with `rabbitmq: true`.
      # Services that do not read it ignore it.
      RABBITMQ_URL: amqp://users:users@localhost:5672

    steps:
      - uses: actions/checkout@v5

      - name: Preparar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir la imagen de tests
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: test
          # Into the local daemon, not a registry.
          load: true
          tags: servicio:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Correr la suite dentro de la imagen
        run: |
          if [ "${{ inputs.correr-integracion }}" = "true" ]; then
            COMANDO=""
          else
            COMANDO="uv run --no-sync pytest tests/unit --cov=src --cov-report=xml --cov-report=term"
          fi
          docker run --name suite --network host \
            -e DATABASE_URL -e REDIS_URL -e AUTH_REDIS_URL -e JWT_PUBLIC_KEY -e INTERNAL_API_TOKEN -e RABBITMQ_URL \
            servicio:test $COMANDO

      - name: Sacar los reportes del contenedor
        if: always()
        run: |
          docker cp suite:/app/coverage.xml ./coverage.xml || true
          docker cp suite:/app/report.xml ./report.xml || true

      # Reachable without digging through the job log.
      - name: Publicar los reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-de-tests
          path: |
            coverage.xml
            report.xml
          if-no-files-found: warn
          retention-days: 7

      # Always published, even while the gate does not block.
      - name: Publicar la cobertura en el resumen
        if: always()
        run: |
          if [ ! -f coverage.xml ]; then
            echo "No se genero coverage.xml, el paso de tests debe haber fallado antes." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          PORCENTAJE=$(python3 -c "import xml.etree.ElementTree as ET; print(f\"{float(ET.parse('coverage.xml').getroot().get('line-rate')) * 100:.2f}\")")
          echo "PORCENTAJE=$PORCENTAJE" >> "$GITHUB_ENV"
          {
            echo "## Cobertura"
            echo ""
            echo "| Medida | Valor |"
            echo "|---|---:|"
            echo "| Cobertura de lineas | ${PORCENTAJE}% |"
            echo "| Minimo exigido | ${{ inputs.cobertura-minima }}% |"
            echo "| Bloquea el PR | ${{ inputs.bloquear-por-cobertura }} |"
            echo "| Medida dentro de | la imagen Docker del servicio |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Codecov shows the trend over time and comments on the PR with which
      # files dropped. It never blocks: the gate above is what cuts.
      - name: Subir la cobertura a Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Gate de cobertura
        if: always()
        continue-on-error: ${{ !inputs.bloquear-por-cobertura }}
        run: |
          if [ -z "${PORCENTAJE:-}" ]; then
            echo "No hay medicion de cobertura."
            exit 1
          fi
          MINIMO="${{ inputs.cobertura-minima }}"
          if awk "BEGIN { exit !($PORCENTAJE < $MINIMO) }"; then
            echo "::error::Cobertura ${PORCENTAJE}%, por debajo del minimo de ${MINIMO}%."
            exit 1
          fi
          echo "Cobertura ${PORCENTAJE}%, por encima del minimo de ${MINIMO}%."

      # Building proves it compiles; starting it proves it works.
      - name: Construir la imagen de produccion
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: servicio:produccion
          cache-from: type=gha

      - name: Verificar que la imagen de produccion levanta
        run: |
          docker run -d --name servicio --network host \
            -e DATABASE_URL -e REDIS_URL -e AUTH_REDIS_URL -e JWT_PUBLIC_KEY -e INTERNAL_API_TOKEN -e RABBITMQ_URL \
            servicio:produccion
          for _ in $(seq 1 30); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/healthcheck)" = "200" ]; then
              echo "El healthcheck responde 200 desde la imagen construida."
              exit 0
            fi
            sleep 2
          done
          echo "::error::La imagen no respondio 200 en /healthcheck."
          docker logs servicio
          exit 1

      # The runner is discarded, but these steps get reproduced locally.
      - name: Limpiar los contenedores
        if: always()
        run: docker rm -f suite servicio || true
