# CI for the TypeScript repos. Lives here once and is consumed with:
#
#   jobs:
#     ci:
#       uses: tds-g3-2s2026/udesa-x-platform/.github/workflows/ci-node.yml@main
#
# Same shape as ci-python.yml: tests run inside the image, not on the runner.
# The consumer needs a `test` stage in its docker/Dockerfile that writes
# coverage/cobertura-coverage.xml and coverage/junit.xml.

name: CI Node

on:
  workflow_call:
    inputs:
      cobertura-minima:
        description: "Porcentaje minimo de cobertura que exige la consigna."
        type: number
        default: 85
      bloquear-por-cobertura:
        description: >
          Si es true, el PR se bloquea cuando la cobertura queda por debajo del minimo.
          ARQUITECTURA.md activa el gate en S5 para los clientes; hasta entonces el
          porcentaje se reporta sin frenar a nadie.
        type: boolean
        default: false
      verificar-imagen:
        description: >
          Construir tambien la imagen de produccion y verificar que levante. Solo para
          los repos que despliegan un contenedor: el backoffice si, mobile no, porque
          se distribuye por Expo y no tiene imagen.
        type: boolean
        default: false
      puerto-imagen:
        description: "Puerto que expone la imagen de produccion."
        type: number
        default: 80
      ruta-verificacion:
        description: "Ruta que tiene que responder 200 en la imagen de produccion."
        type: string
        default: "/"

jobs:
  calidad:
    name: Lint y formato
    runs-on: ubuntu-latest

    # On the runner: lint reads the source, not the runtime environment.
    steps:
      - uses: actions/checkout@v5

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: ESLint y Prettier
        run: bun run lint

      - name: Tipos
        run: bun x tsc --noEmit

  tests:
    name: Tests y cobertura
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Preparar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir la imagen de tests
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: test
          # Into the local daemon, not a registry.
          load: true
          tags: cliente:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Correr la suite dentro de la imagen
        run: docker run --name suite cliente:test

      - name: Sacar los reportes del contenedor
        if: always()
        run: |
          docker cp suite:/app/coverage/cobertura-coverage.xml ./coverage.xml || true
          docker cp suite:/app/coverage/junit.xml ./report.xml || true

      # Reachable without digging through the job log.
      - name: Publicar los reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-de-tests
          path: |
            coverage.xml
            report.xml
          if-no-files-found: warn
          retention-days: 7

      # Always published, even while the gate does not block.
      - name: Publicar la cobertura en el resumen
        if: always()
        run: |
          if [ ! -f coverage.xml ]; then
            echo "No se genero coverage.xml, el paso de tests debe haber fallado antes." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          PORCENTAJE=$(python3 -c "import xml.etree.ElementTree as ET; print(f\"{float(ET.parse('coverage.xml').getroot().get('line-rate')) * 100:.2f}\")")
          echo "PORCENTAJE=$PORCENTAJE" >> "$GITHUB_ENV"
          {
            echo "## Cobertura"
            echo ""
            echo "| Medida | Valor |"
            echo "|---|---:|"
            echo "| Cobertura de lineas | ${PORCENTAJE}% |"
            echo "| Minimo exigido | ${{ inputs.cobertura-minima }}% |"
            echo "| Bloquea el PR | ${{ inputs.bloquear-por-cobertura }} |"
            echo "| Medida dentro de | la imagen Docker del repo |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Codecov shows the trend over time and comments on the PR with which
      # files dropped. It never blocks: the gate above is what cuts.
      - name: Subir la cobertura a Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Gate de cobertura
        if: always()
        continue-on-error: ${{ !inputs.bloquear-por-cobertura }}
        run: |
          if [ -z "${PORCENTAJE:-}" ]; then
            echo "No hay medicion de cobertura."
            exit 1
          fi
          MINIMO="${{ inputs.cobertura-minima }}"
          if awk "BEGIN { exit !($PORCENTAJE < $MINIMO) }"; then
            echo "::error::Cobertura ${PORCENTAJE}%, por debajo del minimo de ${MINIMO}%."
            exit 1
          fi
          echo "Cobertura ${PORCENTAJE}%, por encima del minimo de ${MINIMO}%."

      # Building proves it compiles; starting it proves it works.
      - name: Construir la imagen de produccion
        if: inputs.verificar-imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: cliente:produccion
          cache-from: type=gha

      - name: Verificar que la imagen de produccion levanta
        if: inputs.verificar-imagen
        run: |
          docker run -d --name servicio -p 8080:${{ inputs.puerto-imagen }} cliente:produccion
          for _ in $(seq 1 30); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080${{ inputs.ruta-verificacion }})" = "200" ]; then
              echo "La imagen responde 200 en ${{ inputs.ruta-verificacion }}."
              exit 0
            fi
            sleep 2
          done
          echo "::error::La imagen no respondio 200 en ${{ inputs.ruta-verificacion }}."
          docker logs servicio
          exit 1

      # The runner is discarded, but these steps get reproduced locally.
      - name: Limpiar los contenedores
        if: always()
        run: docker rm -f suite servicio || true
